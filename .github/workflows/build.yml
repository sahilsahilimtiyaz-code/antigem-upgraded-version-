name: Build Android APK

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      build_mode:
        description: 'Build mode (debug, release, or both)'
        required: false
        default: 'both'
        type: choice
        options:
          - both
          - debug
          - release

permissions:
  contents: write
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build AntiGem APKs & Bridge
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install System Dependencies (xz-utils)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y xz-utils

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Go 1.24
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache-dependency-path: agy_ide_bridge/go.sum

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Read Version Metadata
        id: version
        run: |
          VERSION_NAME=$(python3 -c "import json; print(json.load(open('version.json')).get('version_name', '1.0.0'))")
          VERSION_CODE=$(python3 -c "import json; print(json.load(open('version.json')).get('version_code', 1))")
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "Building AntiGem v${VERSION_NAME} (code ${VERSION_CODE})"

      - name: Prepare Signing Keystore
        run: |
          if [ -n "${RELEASE_KEYSTORE_BASE64:-}" ]; then
            echo "Using RELEASE_KEYSTORE_BASE64 secret for release signing..."
            echo "${RELEASE_KEYSTORE_BASE64}" | base64 -d > app/release.jks
          elif [ -f "debug.keystore" ]; then
            echo "RELEASE_KEYSTORE_BASE64 not set; generating fallback release.jks for unsigned/CI builds..."
            keytool -genkeypair -v \
              -keystore app/release.jks \
              -alias antigem \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass 123456 \
              -keypass 123456 \
              -dname "CN=AntiGem, OU=Mobile, O=AntiGem, L=Local, S=Local, C=US"
          fi
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}

      - name: Build Go IDE Bridge (ARM64)
        run: |
          chmod +x gradlew
          ./gradlew :app:compressAgyIdeBridge --no-configuration-cache
          ls -lh app/src/main/assets/bin/agy_ide_bridge.xz

      - name: Build Debug APKs (Termux, Standard, TermuxShared)
        if: ${{ github.event.inputs.build_mode != 'release' }}
        run: |
          mkdir -p output
          ./gradlew :app:assembleTermuxDebug :app:assembleStandardDebug :app:assembleTermuxSharedDebug --no-configuration-cache
          find app/build/outputs/apk/termux/debug -name "*.apk" -exec cp {} "output/antiGem-termux-v${{ steps.version.outputs.version_name }}-debug.apk" \;
          find app/build/outputs/apk/standard/debug -name "*.apk" -exec cp {} "output/antiGem-standard-v${{ steps.version.outputs.version_name }}-debug.apk" \;
          find app/build/outputs/apk/termuxShared/debug -name "*.apk" -exec cp {} "output/antiGem-termux-shared-v${{ steps.version.outputs.version_name }}-debug.apk" \;

      - name: Build Release APKs (Termux, Standard, TermuxShared)
        if: ${{ github.event.inputs.build_mode != 'debug' }}
        run: |
          mkdir -p output
          ./gradlew :app:assembleTermuxRelease :app:assembleStandardRelease :app:assembleTermuxSharedRelease --no-configuration-cache
          find app/build/outputs/apk/termux/release -name "*.apk" -exec cp {} "output/antiGem-termux-v${{ steps.version.outputs.version_name }}-release.apk" \;
          find app/build/outputs/apk/standard/release -name "*.apk" -exec cp {} "output/antiGem-standard-v${{ steps.version.outputs.version_name }}-release.apk" \;
          find app/build/outputs/apk/termuxShared/release -name "*.apk" -exec cp {} "output/antiGem-termux-shared-v${{ steps.version.outputs.version_name }}-release.apk" \;

      - name: Copy Bridge Binary & Generate SHA-256 Checksums
        run: |
          mkdir -p output
          if [ -f "app/build/intermediates/agyIdeBridge/agy_ide_bridge" ]; then
            cp "app/build/intermediates/agyIdeBridge/agy_ide_bridge" "output/agy_ide_bridge-v${{ steps.version.outputs.version_name }}-android-arm64"
          fi
          cd output
          sha256sum *.apk agy_ide_bridge* > SHA256SUMS.txt 2>/dev/null || true
          ls -lh

      - name: Upload Built APKs as GitHub Actions Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AntiGem-APKs-v${{ steps.version.outputs.version_name }}-${{ github.sha }}
          path: |
            output/*.apk
            output/agy_ide_bridge*
            output/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
