name: Build & Publish Release

on:
  push:
    branches:
      - master
      - main
    paths:
      - 'version.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # full history: the app's "What's new" page is generated from every commit of version.json
          fetch-depth: 0
          submodules: false

      - name: Clean Orphaned Submodule Entry (antigem_plugins)
        run: |
          if git ls-files --stage | grep -q "^160000 .*antigem_plugins"; then
            echo "Removing orphaned antigem_plugins gitlink from index..."
            git rm -rf --cached --ignore-unmatch antigem_plugins || true
          fi

      - name: Install System Dependencies (xz-utils)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y xz-utils

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache-dependency-path: agy_ide_bridge/go.sum

      - name: Accept Android SDK Licenses
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="${ANDROID_HOME}"
          echo "ANDROID_HOME=${ANDROID_HOME}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_HOME}" >> "$GITHUB_ENV"
          SDKMANAGER=$(find "${ANDROID_HOME}/cmdline-tools" -name sdkmanager -type f 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -n "${SDKMANAGER}" ]; then
            yes | "${SDKMANAGER}" --licenses > /dev/null 2>&1 || true
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configure Gradle & Kotlin Memory for CI
        run: |
          sed -i '/^org\.gradle\.jvmargs=/d' gradle.properties
          sed -i '/^kotlin\.daemon\.jvmargs=/d' gradle.properties
          sed -i '/^kotlin\.compiler\.execution\.strategy=/d' gradle.properties
          sed -i '/^org\.gradle\.workers\.max=/d' gradle.properties
          cat >> gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx5120m -XX:MaxMetaspaceSize=1024m -XX:+UseG1GC -Dfile.encoding=UTF-8
          kotlin.daemon.jvmargs=-Xmx5120m -XX:MaxMetaspaceSize=1024m -XX:+UseG1GC
          kotlin.compiler.execution.strategy=daemon
          org.gradle.workers.max=2
          org.gradle.daemon.performance.disable-logging=true
          EOF

      - name: Parse version.json
        id: version
        run: |
          VERSION_NAME=$(python3 -c "import json; print(json.load(open('version.json')).get('version_name', '1.0.0'))")
          VERSION_CODE=$(python3 -c "import json; print(json.load(open('version.json')).get('version_code', 1))")
          CHANGELOG=$(python3 -c "import json; cl = json.load(open('version.json')).get('changelog', ''); print('\n'.join(cl) if isinstance(cl, list) else cl)")
          echo "tag=v${VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "name=v${VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Restore Keystore from Secret
        run: |
          if [ -n "${RELEASE_KEYSTORE_BASE64:-}" ]; then
            echo "${RELEASE_KEYSTORE_BASE64}" | base64 -d > app/release.jks
          else
            echo "Warning: RELEASE_KEYSTORE_BASE64 secret not found, generating fallback keystore for release build..."
            keytool -genkeypair -v \
              -keystore app/release.jks \
              -alias antigem \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass 123456 \
              -keypass 123456 \
              -dname "CN=AntiGem, OU=Mobile, O=AntiGem, L=Local, S=Local, C=US"
          fi
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}

      - name: Build Release APKs
        run: |
          chmod +x gradlew scripts/build_all_apks.sh
          ./scripts/build_all_apks.sh --release

      - name: Upload Release APKs Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AntiGem-Release-${{ steps.version.outputs.tag }}
          path: output/*

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.name }}
          body: ${{ steps.version.outputs.changelog }}
          generate_release_notes: true
          files: output/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
